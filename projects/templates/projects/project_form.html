{% extends "base.html" %}

{% block title %}
New Project
{% endblock %}

{% block content %}

<h1 class="mb-4">
    New Project
</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">

            {% csrf_token %}

            {{form.as_p}}

            <button type="submit" class="btn btn-primary">
                Save Project
            </button>

            <a href="{% url 'projects:list' %}"
            class="btn btn-secondary">
            Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
