{% extends "base.html" %}

{% block title %}
Delete Project
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Delete Project
</h1>

<div class="alert alert-danger">
    <p>
        Are you sure you want to delete
        <strong>{{ project.title }}</strong>?
    </p>

    <p class="mb-0">
        This action cannot be undone.
    </p>
</div>

<form method="post">
    {% csrf_token %}

    <button 
        type="submit"

        class="btn btn-danger">
        Delete Project
    </button>

    <a href="{% url 'projects:detail' project.pk %}"
        class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
