{% extends "base.html" %}

{% block title %}
Delete Message
{% endblock %}

{% block content %}

<h2>Delete Message</h2>

<div class="alert alert-danger">
    Are you sure you want to delete the message:
    <br><br>

    <strong>{{ message.subject }}</strong>
</div>

<form method="post">

    {% csrf_token %}

    <button 
            type="submit"
            class="btn btn-danger">
        Yes, delete
    </button>

    <a 
        href="{% url 'messaging:detail' message.pk %}"
        class="btn btn-secondary">
    
        Cancel 
    </a>
</form>

{% endblock %}
