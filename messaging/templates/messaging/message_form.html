{% extends "base.html" %}

{% block title %}
New Messages
{% endblock %}

{% block content %}

<h1 class="mb-4">
    New Message
</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        class="btn btn-primary"
        type="submit">
    Send Message
    </button>

    <a 
        class="btn btn-secondary"
        href="{% url 'dashboard:home' %}">
    Cancel
    </a>
</form>

{% endblock %}
