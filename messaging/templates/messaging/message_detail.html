{% extends "base.html" %}

{% block title %}
{{ message.subject }}
{% endblock %}

{% block content %}

<h1>{{ message.subject }}</h1>

<hr>

<p>
    <strong>From:</strong>
    {{ message.sender.username }}
</p>

<p>
    <strong>Sent:</strong>
    {{ message.sent_at|date:"d M Y H:i" }}
</p>

<hr>

<div class="card">
    <div class="card-body">
        {{ message.body|linebreaks }}
    </div>
</div>

<p class="mt-3">

    <a 
        class="btn btn-secondary"
        href="{% url 'messaging:inbox' %}">
        Back to Inbox.
    </a>
</p>

{% endblock %}
