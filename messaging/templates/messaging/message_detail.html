{% extends "base.html" %}

{% block title %}
{{ message.subject }}
{% endblock %}

{% block content %}

<h1>{{ message.subject }}</h1>

<hr>

<p>
    <strong>From:</strong>
    {{ message.sender.username }}
</p>

<p>
    <strong>Sent:</strong>
    {{ message.sent_at|date:"d M Y H:i" }}
</p>

<hr>

<div class="card">
    <div class="card-body">
        {{ message.body|linebreaks }}
    </div>
</div>

<div class="mt-3">

    <a
        href="{% url 'messaging:new' %}?recipient={{ message.sender.id }}&subject=Re: {{ message.subject }}"
        class="btn btn-primary">

        Reply

    </a>

    <a
        href="{% url 'messaging:inbox' %}"
        class="btn btn-secondary">

        Back to Inbox

    </a>

</div>

{% endblock %}
