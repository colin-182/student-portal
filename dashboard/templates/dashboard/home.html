{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Dashboard
</h1>

<div class="row">

    <div class="col-md-4 mb-4">

        <a
            href="{% url 'projects:list' %}"
            class="text-decoration-none">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-folder display-4 text-primary"></i>

                    <h5 class="mt-3">
                        Projects
                    </h5>

                    <h2>
                        {{ project_count }}
                    </h2>

                </div>

            </div>

        </a>

    </div>

    <div class="col-md-4 mb-4">

        <a
            href="{% url 'messaging:inbox' %}"
            class="text-decoration-none">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-chat-dots display-4 text-success"></i>

                    <h5 class="mt-3">
                        Unread Messages
                    </h5>

                    <h2>
                        {{ unread_messages }}
                    </h2>

                </div>

            </div>

        </a>

    </div>

    <div class="col-md-4 mb-4">

        <a
            href="{% url 'messaging:inbox' %}"
            class="text-decoration-none">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-envelope display-4 text-warning"></i>

                    <h5 class="mt-3">
                        Total Messages
                    </h5>

                    <h2>
                        {{ total_messages }}
                    </h2>

                </div>

            </div>

        </a>

    </div>

</div>

{% endblock %}
